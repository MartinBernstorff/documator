pre-commit:
  piped: true
  commands:
    docs:
      run: moon run documator:docs
      stage_fixed: true
    fix:
      priority: 1
      run: moon run documator:lint-fix documator:format-fix documator:zizmor-fix
      stage_fixed: true
    moon-ci:
      priority: 2
      run: moon ci --base main

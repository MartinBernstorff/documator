$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'python'
stack: 'backend'
layer: 'application'
tags: ['backend']

fileGroups:
  sources:
    - 'src/**/*.py'
  tests:
    - 'src/**/test_*.py'

tasks:
  test:
    script: 'uv run pytest'
    inputs:
      - 'pytest.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '@group(sources)'
      - '@group(tests)'

  # xdist makes inline-snapshot self-disable, so recording needs a single process;
  # testmon would deselect the very tests whose snapshots are missing. Rewrites test
  # sources, so it is type 'run' to stay out of `moon check` and `moon ci`.
  snapshot:
    type: 'run'
    script: 'uv run pytest -n0 --testmon-noselect --inline-snapshot=create,fix'
    options:
      cache: false
      runInCI: false

  lint:
    script: 'uv run ruff check'
    inputs:
      - 'ruff.toml'
      - 'pyproject.toml'
      - '@group(sources)'
      - '@group(tests)'

  format:
    script: 'uv run ruff format --check'
    inputs:
      - 'ruff.toml'
      - 'pyproject.toml'
      - '@group(sources)'
      - '@group(tests)'

  typecheck:
    script: 'uv run pyrefly check'
    inputs:
      - 'pyrefly.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '@group(sources)'
      - '@group(tests)'

  modularity:
    script: 'uv run tach check'
    inputs:
      - 'tach.toml'
      - '@group(sources)'

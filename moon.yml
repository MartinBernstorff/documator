$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'python'
stack: 'backend'
layer: 'application'
tags: ['backend']

fileGroups:
  sources:
    - 'src/**/*.py'
  tests:
    - 'src/**/test_*.py'

tasks:
  test:
    script: 'uv run pytest'
    inputs:
      - 'pytest.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '@group(sources)'
      - '@group(tests)'

  # xdist makes inline-snapshot self-disable, so recording needs a single process;
  # testmon would deselect the very tests whose snapshots are missing, and the shared
  # fail-fast would stop before the later snapshots are written. Rewrites test sources,
  # so it is type 'run' to stay out of `moon check` and `moon ci`.
  snapshot:
    type: 'run'
    script: 'uv run pytest -n0 --maxfail=0 --testmon-noselect --inline-snapshot=create,fix'
    options:
      cache: false
      runInCI: false

  lint:
    script: 'uv run ruff check'
    inputs:
      - 'ruff.toml'
      - 'pyproject.toml'
      - '@group(sources)'
      - '@group(tests)'

  lint-fix:
    extends: 'lint'
    script: 'uv run ruff check --fix'
    type: 'run'
    options:
      cache: false
      runInCI: false

  format:
    script: 'uv run ruff format --check'
    inputs:
      - 'ruff.toml'
      - 'pyproject.toml'
      - '@group(sources)'
      - '@group(tests)'

  format-fix:
    extends: 'format'
    script: 'uv run ruff format'
    deps: ['lint-fix']
    type: 'run'
    options:
      cache: false
      runInCI: false

  typecheck:
    script: 'uv run pyrefly check'
    inputs:
      - 'pyrefly.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '@group(sources)'
      - '@group(tests)'

  actionlint:
    script: 'actionlint'
    inputs:
      - '.github/workflows/*.yml'

  # Offline by default: the online audits need a GitHub token, which would make the
  # task unrunnable without network and uncacheable on its inputs.
  zizmor:
    script: 'uv run zizmor --persona auditor --min-severity informational --min-confidence low --strict-collection .'
    inputs:
      - '.github/**/*.yml'
      - 'uv.lock'

  zizmor-fix:
    extends: 'zizmor'
    script: 'uv run zizmor --persona auditor --min-severity informational --min-confidence low --strict-collection --fix .'
    type: 'run'
    options:
      cache: false
      runInCI: false

  # Baselined: the 105 violations that predate the tool are recorded, so only new
  # primitives fail. Delete entries from the baseline as they are wrapped.
  noprim:
    script: 'uv run noprim check --baseline noprim-baseline.json src'
    inputs:
      - 'noprim.toml'
      - 'noprim-baseline.json'
      - '@group(sources)'
      - '@group(tests)'

  modularity:
    script: 'uv run tach check'
    inputs:
      - 'tach.toml'
      - '@group(sources)'

  docs:
    script: 'uv run documator render templates .'
    inputs:
      - 'templates/**/*.md'
      - 'templates/**/*.yml'
      - 'pyproject.toml'
      - 'uv.lock'

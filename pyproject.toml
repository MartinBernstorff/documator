[project]
name = "documator"
dynamic = ["version"]
description = "A documentation tool"
readme = "README.md"
authors = [
    { name = "Martin Bernstorff", email = "martinbernstorff@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "colorlog>=6.12.0",
    "iterpy>=1.14.0",
    "pydantic>=2.13.4",
    "typer>=0.27.0",
    "watchfiles>=1.2.0",
]

[project.scripts]
documator = "documator.cli:main"

[build-system]
# uv_build rejects `dynamic = ["version"]`, so the version cannot come from the git tag there.
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/documator"]

[tool.semantic_release]
# No version_toml: the version lives only in the tag, so nothing is written back to main.
build_command = ""

[dependency-groups]
dev = [
    "inline-snapshot>=0.35.2",
    "lefthook>=2.1.10",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "pytest-randomly>=4.1.0",
    "pytest-testmon>=2.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.0",
    "tach>=0.35.0",
    "zizmor>=1.29.0",
]
